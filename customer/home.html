<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Stalls - Sarawak Food Court</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/customer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="../index.html" class="back-btn" title="Back to Login Page">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div class="table-info">
                <i class="fas fa-chair"></i>
                <span>Table <strong id="tableNumber">-</strong></span>
            </div>
            <h1 id="foodCourtTitle">Food Stalls</h1>
            <a href="cart.html" class="cart-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </a>
        </div>
    </header>
    
    <!-- Advertisement Banner -->
    <div class="ad-banner" id="adBanner">
        <div class="ad-content">
            <i class="fas fa-gift"></i>
            <span>🎉 Special Offer! Get 10% off on orders above RM30!</span>
        </div>
    </div>
    
    <!-- Search and Filter -->
    <div class="search-section">
        <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search food stalls..." oninput="filterStalls()">
        </div>
        <div class="filter-chips">
            <button class="filter-chip active" onclick="filterByCategory('all')">All</button>
            <button class="filter-chip" onclick="filterByCategory('asian')">Asian</button>
            <button class="filter-chip" onclick="filterByCategory('western')">Western</button>
            <button class="filter-chip" onclick="filterByCategory('drinks')">Drinks</button>
            <button class="filter-chip" onclick="filterByCategory('dessert')">Dessert</button>
        </div>
    </div>
    
    <!-- Food Stalls Grid -->
    <main class="main-content">
        <div class="stalls-grid" id="stallsGrid">
            <!-- Stalls will be loaded dynamically -->
            <div class="loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading stalls...</p>
            </div>
        </div>
    </main>
    
    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="cart.html" class="nav-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
            <span class="nav-badge" id="cartCountNav">0</span>
        </a>
        <a href="order-tracking.html" class="nav-item">
            <i class="fas fa-receipt"></i>
            <span>Orders</span>
        </a>
    </nav>
    
    <script src="../js/app.js"></script>
    <script src="../js/customer.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabase;
        
        // Initialize Supabase
        function initializeSupabase() {
            try {
                const SUPABASE_URL = 'https://mtmkghuhhrerlcubhzot.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bWtnaHVoaHJlcmxjdWJoem90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE1Mzc5NzIsImV4cCI6MjA3NzExMzk3Mn0.kA-NUWidhSRNPotmVe3KIclk8LpizR26DzxIBn5C1rA';
                
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase connected!');
                return true;
            } catch (error) {
                console.error('❌ Failed to initialize Supabase:', error);
                return false;
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Supabase
            initializeSupabase();
            
            // Get table number and food court from URL or localStorage
            const urlParams = new URLSearchParams(window.location.search);
            const table = urlParams.get('table') || localStorage.getItem('tableNumber') || '1';
            const foodCourtId = urlParams.get('foodcourt') || localStorage.getItem('foodCourtId');
            const stallId = urlParams.get('stall'); // Check if scanning directly to a stall
            
            // Store for later use
            localStorage.setItem('tableNumber', table);
            if (foodCourtId) {
                localStorage.setItem('foodCourtId', foodCourtId);
            }
            
            document.getElementById('tableNumber').textContent = table;
            
            // Show saved food court name immediately if available
            const savedFoodCourtName = localStorage.getItem('foodCourtName');
            if (savedFoodCourtName) {
                document.getElementById('foodCourtTitle').textContent = savedFoodCourtName;
            }
            
            // Check for pending orders by guest session
            await checkPendingOrders();
            
            // Update cart count
            updateCartCount();
            
            // If stall ID is provided, redirect to menu directly
            if (stallId && supabase) {
                // First, get the stall name to show in title briefly
                const { data: stallData } = await supabase
                    .from('hawker_stalls')
                    .select('stall_name')
                    .eq('id', stallId)
                    .single();
                
                if (stallData) {
                    document.getElementById('foodCourtTitle').textContent = stallData.stall_name;
                }
                
                // Redirect to menu after a brief moment
                setTimeout(() => {
                    window.location.href = `./menu.html?stall=${stallId}`;
                }, 500);
                return;
            }
            
            // Load stalls (from Supabase if food court ID is provided, otherwise load all)
            if (foodCourtId && foodCourtId !== 'YOUR_FOODCOURT_ID' && supabase) {
                await loadStallsFromDatabase(foodCourtId);
            } else if (supabase) {
                // Load all stalls if no specific food court
                await loadAllStallsFromDatabase();
            } else {
                await loadStalls();
            }
        });
        
        let currentCategory = 'all';
        
        // Load stalls from Supabase database (for specific food court)
        async function loadStallsFromDatabase(foodCourtId) {
            try {
                console.log('📍 Loading stalls for food court:', foodCourtId);
                
                // Fetch food court name
                const { data: foodCourt, error: fcError } = await supabase
                    .from('food_courts')
                    .select('name')
                    .eq('id', foodCourtId)
                    .single();
                
                if (!fcError && foodCourt) {
                    document.getElementById('foodCourtTitle').textContent = foodCourt.name;
                    localStorage.setItem('foodCourtName', foodCourt.name);
                    console.log('✅ Food court name:', foodCourt.name);
                }
                
                // Fetch hawker stalls from database for this food court
                const { data: stalls, error } = await supabase
                    .from('hawker_stalls')
                    .select(`
                        id,
                        stall_name,
                        cuisine_type,
                        description,
                        image_url,
                        status,
                        is_open,
                        users:hawker_id (
                            full_name
                        )
                    `)
                    .eq('food_court_id', foodCourtId)
                    .eq('status', 'active');

                if (error) throw error;

                // Get menu item counts for each stall
                const { data: menuCounts, error: menuError } = await supabase
                    .from('menu_items')
                    .select('stall_id')
                    .eq('available', true);

                // Count items per stall
                const itemCountMap = {};
                if (menuCounts && !menuError) {
                    menuCounts.forEach(item => {
                        itemCountMap[item.stall_id] = (itemCountMap[item.stall_id] || 0) + 1;
                    });
                }

                // Transform to match expected format
                const transformedStalls = stalls.map(stall => ({
                    id: stall.id,
                    name: stall.stall_name,
                    description: stall.description || 'Delicious food awaits!',
                    category: stall.cuisine_type,
                    image: stall.image_url || 'https://via.placeholder.com/400x300?text=Food+Stall',
                    rating: 4.5, // Default rating for now
                    isOpen: stall.is_open !== false, // Use is_open toggle from hawker settings
                    itemCount: itemCountMap[stall.id] || 0 // Get actual count from database
                }));

                console.log('✅ Loaded stalls from database:', transformedStalls);
                displayStalls(transformedStalls);
                
            } catch (error) {
                console.error('Error loading stalls from database:', error);
                // Fallback to loading all stalls
                await loadAllStallsFromDatabase();
            }
        }
        
        // Load all stalls from database (no specific food court filter)
        async function loadAllStallsFromDatabase() {
            try {
                console.log('📍 Loading all stalls from database...');
                
                // Try to get food court name if there's only one
                const { data: foodCourts, error: fcError } = await supabase
                    .from('food_courts')
                    .select('id, name')
                    .limit(2);
                
                if (!fcError && foodCourts && foodCourts.length === 1) {
                    // Only one food court exists, use its name
                    document.getElementById('foodCourtTitle').textContent = foodCourts[0].name;
                    localStorage.setItem('foodCourtName', foodCourts[0].name);
                    localStorage.setItem('foodCourtId', foodCourts[0].id);
                    console.log('✅ Using food court:', foodCourts[0].name);
                } else if (!fcError && foodCourts && foodCourts.length > 1) {
                    // Multiple food courts, show generic title
                    document.getElementById('foodCourtTitle').textContent = 'All Food Stalls';
                }
                
                // Fetch ALL hawker stalls from database
                const { data: stalls, error } = await supabase
                    .from('hawker_stalls')
                    .select(`
                        id,
                        stall_name,
                        cuisine_type,
                        description,
                        image_url,
                        status,
                        is_open,
                        users:hawker_id (
                            full_name
                        )
                    `)
                    .eq('status', 'active');

                if (error) throw error;

                // Get menu item counts for each stall
                const { data: menuCounts, error: menuError } = await supabase
                    .from('menu_items')
                    .select('stall_id')
                    .eq('available', true);

                // Count items per stall
                const itemCountMap = {};
                if (menuCounts && !menuError) {
                    menuCounts.forEach(item => {
                        itemCountMap[item.stall_id] = (itemCountMap[item.stall_id] || 0) + 1;
                    });
                }

                // Transform to match expected format
                const transformedStalls = stalls.map(stall => ({
                    id: stall.id,
                    name: stall.stall_name,
                    description: stall.description || 'Delicious food awaits!',
                    category: stall.cuisine_type,
                    image: stall.image_url || 'https://via.placeholder.com/400x300?text=Food+Stall',
                    rating: 4.5,
                    isOpen: stall.is_open !== false,
                    itemCount: itemCountMap[stall.id] || 0
                }));

                console.log('✅ Loaded all stalls from database:', transformedStalls);
                displayStalls(transformedStalls);
                
            } catch (error) {
                console.error('Error loading all stalls from database:', error);
                // Last resort: try JSON file
                await loadStalls();
            }
        }
        
        async function loadStalls() {
            try {
                const response = await fetch('../data/stalls.json');
                const stalls = await response.json();
                displayStalls(stalls);
            } catch (error) {
                console.error('Error loading stalls:', error);
                document.getElementById('stallsGrid').innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <p>Unable to load stalls. Please refresh the page.</p>
                    </div>
                `;
            }
        }
        
        function displayStalls(stalls) {
            const grid = document.getElementById('stallsGrid');
            
            if (stalls.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-store-slash"></i>
                        <p>No stalls available</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = stalls.map(stall => `
                <div class="stall-card ${!stall.isOpen ? 'closed-stall' : ''}" data-category="${stall.category}">
                    <div class="stall-image" style="background-image: url('${stall.image}'); position: relative;">
                        ${!stall.isOpen ? '<div class="closed-badge">Closed</div>' : ''}
                        ${stall.rating ? `
                            <div class="rating-badge">
                                <i class="fas fa-star"></i> ${stall.rating}
                            </div>
                        ` : ''}
                    </div>
                    <div class="stall-info">
                        <h3>${stall.name}</h3>
                        <p class="stall-description">${stall.description}</p>
                        <div class="stall-meta">
                            <span class="stall-category">
                                <i class="fas fa-tag"></i> ${stall.category}
                            </span>
                            <span class="stall-items">
                                ${stall.itemCount} items
                            </span>
                        </div>
                        ${!stall.isOpen ? `
                            <button class="btn-primary disabled" onclick="showClosedMessage('${stall.name.replace(/'/g, "\\'")}')">
                                <i class="fas fa-lock"></i> Stall Closed
                            </button>
                        ` : `
                            <button class="btn-primary" onclick="viewMenu('${stall.id}')">
                                <i class="fas fa-utensils"></i> View Menu
                            </button>
                        `}
                    </div>
                </div>
            `).join('');
        }
        
        function filterByCategory(category) {
            currentCategory = category;
            
            // Update active filter chip
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Filter stalls
            const stalls = document.querySelectorAll('.stall-card');
            stalls.forEach(stall => {
                if (category === 'all' || stall.dataset.category === category) {
                    stall.style.display = 'block';
                } else {
                    stall.style.display = 'none';
                }
            });
        }
        
        function filterStalls() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const stalls = document.querySelectorAll('.stall-card');
            
            stalls.forEach(stall => {
                const name = stall.querySelector('h3').textContent.toLowerCase();
                const description = stall.querySelector('.stall-description').textContent.toLowerCase();
                
                if (name.includes(searchTerm) || description.includes(searchTerm)) {
                    stall.style.display = 'block';
                } else {
                    stall.style.display = 'none';
                }
            });
        }
        
        function viewMenu(stallId) {
            // Safari-friendly navigation - use simple relative path
            window.location.href = 'menu.html?stall=' + stallId;
        }
        
        async function checkPendingOrders() {
            const guestSession = localStorage.getItem('guestSession');
            
            if (!guestSession || !supabase) {
                return;
            }
            
            console.log('🔍 Checking for pending orders for guest:', guestSession);
            
            try {
                // Check if there's a pending order for this guest session
                const { data: orders, error } = await supabase
                    .from('orders')
                    .select('order_id, status')
                    .eq('guest_session', guestSession)
                    .neq('status', 'completed')
                    .order('created_at', { ascending: false })
                    .limit(1);
                
                if (error) {
                    console.error('❌ Error checking pending orders:', error);
                    return;
                }
                
                if (orders && orders.length > 0) {
                    console.log('✅ Found pending order:', orders[0].order_id);
                    
                    // Show notification
                    const notification = document.createElement('div');
                    notification.className = 'pending-order-banner';
                    notification.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 1rem; padding: 1rem; background: #FFF3CD; border: 2px solid #FF9800; border-radius: 8px; margin: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                            <i class="fas fa-receipt" style="font-size: 2rem; color: #FF9800;"></i>
                            <div style="flex: 1;">
                                <h3 style="margin: 0 0 0.25rem 0; color: #E65100;">You have a pending order!</h3>
                                <p style="margin: 0; color: #F57C00; font-size: 0.9rem;">Order #${orders[0].order_id} - Status: ${orders[0].status}</p>
                            </div>
                            <button onclick="window.location.href='order-tracking.html?order=${orders[0].order_id}'" 
                                    style="padding: 0.75rem 1.5rem; background: #FF9800; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">
                                View Order
                            </button>
                        </div>
                    `;
                    
                    // Insert after header
                    const header = document.querySelector('.header');
                    if (header && header.nextSibling) {
                        header.parentNode.insertBefore(notification, header.nextSibling);
                    }
                }
            } catch (error) {
                console.error('❌ Error in checkPendingOrders:', error);
            }
        }
        
        function showClosedMessage(stallName) {
            // Show toast notification that stall is closed
            const toast = document.createElement('div');
            toast.className = 'toast toast-warning';
            toast.innerHTML = `
                <i class="fas fa-lock"></i> 
                <strong>${stallName}</strong> is currently closed. Please check back later!
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartCountNav').textContent = count;
            
            if (count > 0) {
                document.querySelector('.cart-icon').classList.add('has-items');
            }
        }
    </script>
</body>
</html>
