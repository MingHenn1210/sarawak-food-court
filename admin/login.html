<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/hawker.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-user-shield"></i>
                <h1>Admin Login</h1>
                <p>System Administration</p>
            </div>
            
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                
                <button type="submit" class="btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <div class="login-footer">
                <a href="../index.html">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
    
    <script src="../js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let supabase;
        
        // Initialize Supabase
        function initializeSupabase() {
            try {
                const SUPABASE_URL = 'https://mtmkghuhhrerlcubhzot.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bWtnaHVoaHJlcmxjdWJoem90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE1Mzc5NzIsImV4cCI6MjA3NzExMzk3Mn0.kA-NUWidhSRNPotmVe3KIclk8LpizR26DzxIBn5C1rA';
                
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                console.log('✅ Supabase connected');
                return true;
            } catch (error) {
                console.error('❌ Failed to initialize Supabase:', error);
                return false;
            }
        }
        
        // Initialize on page load
        initializeSupabase();
        
        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            btn.disabled = true;
            
            try {
                console.log('Attempting login with email:', username);
                
                // Try database authentication first
                if (supabase) {
                    const { data: users, error } = await supabase
                        .from('users')
                        .select('*')
                        .eq('email', username)
                        .eq('role', 'admin')
                        .eq('password_hash', password)
                        .single();
                    
                    if (error && error.code !== 'PGRST116') {
                        console.error('Database error:', error);
                    }
                    
                    if (users) {
                        console.log('✅ Admin found in database');
                        
                        // Save session
                        const session = {
                            userId: users.id,
                            username: users.email,
                            name: users.full_name,
                            loginTime: new Date().toISOString()
                        };
                        
                        localStorage.setItem('adminSession', JSON.stringify(session));
                        console.log('✅ Session saved');
                        
                        // Show success
                        btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                        btn.style.background = '#27ae60';
                        
                        // Redirect to dashboard
                        setTimeout(() => {
                            console.log('Redirecting to dashboard...');
                            window.location.href = 'dashboard.html';
                        }, 500);
                        return;
                    }
                }
                
                // Fallback: hardcoded admin credentials
                if (username === 'admin' && password === 'admin123') {
                    console.log('✅ Fallback credentials valid');
                    
                    // Save session
                    const session = {
                        userId: 'admin-1',
                        username: username,
                        name: 'Administrator',
                        loginTime: new Date().toISOString()
                    };
                    
                    localStorage.setItem('adminSession', JSON.stringify(session));
                    console.log('✅ Session saved');
                    
                    // Show success
                    btn.innerHTML = '<i class="fas fa-check"></i> Success!';
                    btn.style.background = '#27ae60';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        console.log('Redirecting to dashboard...');
                        window.location.href = 'dashboard.html';
                    }, 500);
                } else {
                    console.log('❌ Invalid credentials');
                    throw new Error('Invalid credentials');
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Login failed! Please check your credentials.\n\nDatabase: admin@sarawak-foodcourt.com / admin123\nOr use: admin / admin123');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            const session = localStorage.getItem('adminSession');
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
